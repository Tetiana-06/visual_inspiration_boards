# Lab 3: Single Entry Point — Nginx Load Balancer.
# Файл монтується в /etc/nginx/conf.d/, тобто це вміст блоку http {}.
# Після зміни: docker compose exec nginx nginx -s reload   (без перезапуску, без втрати запитів)

# Вбудований DNS Docker: імена backend-N перечитуються кожні 5 с,
# тож зупинений контейнер зникає з пулу, а запущений — повертається.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream backend_cluster {
    zone backend_cluster 64k;   # спільна пам'ять — потрібна для "resolve"

    #  Алгоритм балансування: без директиви = Round Robin
    least_conn;               # Least Connections
    # ip_hash;                  # IP Hash (прив'язка клієнта до вузла)

    # Пасивний health check: 2 невдалі спроби за 10 с => вузол виключається з пулу на 10 с.
    # Weighted Round Robin: додати weight=N, наприклад "server backend-1:8000 weight=3 ..."
    server backend-1:8000 resolve max_fails=2 fail_timeout=10s;
    server backend-2:8000 resolve max_fails=2 fail_timeout=10s;
    server backend-3:8000 resolve max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Failover: якщо вузол не відповів або повернув 502/503/504 —
    # той самий запит повторюється на наступному вузлі, клієнт помилки не бачить.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 1s;
    proxy_read_timeout 30s;

    location /static/ {
        proxy_pass http://backend_cluster/static/;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://backend_cluster;
    }
}
