events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Multi-node Stateless Backend Upstream (Lab 2: Round-Robin without Sticky Sessions)
    upstream backend_cluster {
        server backend-1:8000 max_fails=3 fail_timeout=5s;
        server backend-2:8000 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        # Static UI & Assets Cache
        location /static/ {
            proxy_pass http://backend_cluster/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header X-Instance-ID;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # API & Root App Proxy (Load Balanced Across Stateless Instances)
        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pass through the instance identification header for Lab 2 verification
            proxy_pass_header X-Instance-ID;

            # Automatic failover if an instance fails or is stopped
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_read_timeout 60s;
        }

        # Health endpoint shortcut
        location /health {
            proxy_pass http://backend_cluster/api/v1/health;
            proxy_pass_header X-Instance-ID;
        }
    }
}
