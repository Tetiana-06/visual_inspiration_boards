services:
  # Primary Relational DBMS with JSONB support & disk persistence
  postgres:
    image: postgres:16-alpine
    container_name: vib_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visual_boards
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visual_boards"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Centralized In-memory Cache & Distributed State Layer (Shared by all backend nodes)
  redis:
    image: redis:7-alpine
    container_name: vib_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Stateless Backend Node 1 (Lab 2: Interchangeable Worker 1)
  backend-1:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: vib_backend_1
    restart: unless-stopped
    environment:
      - INSTANCE_ID=backend-instance-1
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/visual_boards
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    expose:
      - "8000"
    networks:
      - app_network

  # Stateless Backend Node 2 (Lab 2: Interchangeable Worker 2)
  backend-2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: vib_backend_2
    restart: unless-stopped
    environment:
      - INSTANCE_ID=backend-instance-2
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/visual_boards
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    expose:
      - "8000"
    networks:
      - app_network

  # Reverse Proxy & Round-Robin Load Balancer (No Sticky Sessions)
  nginx:
    image: nginx:alpine
    container_name: vib_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
